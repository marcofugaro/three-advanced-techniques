# Deploys the website to GitHub Pages: the website at the site's root, and beside it every other file of the repo at its
# own path, so the demos run where the READMEs link them (rendering/bloom/, examples/worm-monster.html).
name: Deploy the website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time: a newer push waits for the running one instead of cancelling it
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # No install scripts: puppeteer's downloads a browser the docs don't need
      - run: npm ci --ignore-scripts
      - run: npm run docs
      # The website moves to the root, over the rest of the repo; the upload leaves out .git and hidden files
      - run: cp -R website/. . && rm -rf website node_modules
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v5
