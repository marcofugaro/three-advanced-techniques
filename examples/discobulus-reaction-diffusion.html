<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#a9bdc5" />
    <title>Discobolus — Gold Reaction Diffusion</title>
    <!-- The downloads the load waits for, started at once rather than once the modules that fetch them have loaded -->
    <link rel="preload" href="./discobulus-reaction-diffusion.bake" as="fetch" crossorigin />
    <link rel="preload" href="./models/discobulus.glb" as="fetch" crossorigin />
    <link rel="preload" href="./models/discobulus-isotropic.glb" as="fetch" crossorigin />
    <style>
      /* The backdrop as it renders, top to bottom, so the page matches it before the first frame */
      html {
        min-height: 100%;
        background: #a9bdc5 linear-gradient(#98abb4, #bad5e2);
      }

      body {
        margin: 0;
        overflow: hidden;
      }

      /* Touches paint and turn the plinth, never scroll or zoom, and a held one erases: no selection, callout or
         magnifier */
      canvas {
        display: block;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }

      /* The zoom buttons, placed beside their parts every frame: light frosted glass under a white glyph; in a close-up
         its + turns to a ×. */
      .zoom-button {
        --size: 44px;
        --ease: cubic-bezier(0.22, 1, 0.36, 1);
        position: fixed;
        top: 0;
        left: 0;
        z-index: 10;
        display: grid;
        place-items: center;
        width: var(--size);
        height: var(--size);
        padding: 0;
        border: none;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.22);
        backdrop-filter: blur(20px) saturate(180%) brightness(1.06);
        -webkit-backdrop-filter: blur(20px) saturate(180%) brightness(1.06);
        box-shadow:
          inset 0 0 0 1px rgba(255, 255, 255, 0.55),
          inset 0 1px 0 rgba(255, 255, 255, 0.4),
          0 6px 20px rgba(20, 28, 40, 0.12),
          0 1px 2px rgba(20, 28, 40, 0.1);
        color: #fff;
        cursor: pointer;
        opacity: 0;
        pointer-events: none;
        transition:
          opacity 0.5s var(--ease),
          background 0.35s var(--ease);
        will-change: transform;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
      }
      .zoom-button.shown {
        opacity: 1;
        pointer-events: auto;
      }
      .zoom-glyph {
        position: relative;
        display: grid;
        place-items: center;
        width: 100%;
        height: 100%;
        transition: transform 0.3s var(--ease);
      }
      .zoom-glyph svg {
        width: 16px;
        height: 16px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        filter: drop-shadow(0 1px 1.5px rgba(30, 40, 50, 0.35));
        transition: transform 0.6s var(--ease);
      }
      /* A ring breathing out from the circle while it waits */
      .zoom-glyph::after {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: 50%;
        box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.7);
        opacity: 0;
        animation: zoom-ring 2.8s var(--ease) infinite;
        pointer-events: none;
      }
      @keyframes zoom-ring {
        0% { transform: scale(1); opacity: 0.6; }
        70%, 100% { transform: scale(1.7); opacity: 0; }
      }
      .zoom-button.zoomed {
        background: rgba(255, 255, 255, 0.3);
      }
      .zoom-button.zoomed .zoom-glyph svg {
        transform: rotate(45deg);
      }
      .zoom-button.zoomed .zoom-glyph::after {
        animation: none;
      }
      .zoom-button:active .zoom-glyph {
        transform: scale(0.9);
      }
      .zoom-button:focus-visible {
        outline: 2px solid rgba(255, 255, 255, 0.9);
        outline-offset: 3px;
      }
      @media (hover: hover) {
        .zoom-button:not(.zoomed):hover {
          background: rgba(255, 255, 255, 0.36);
        }
        .zoom-button:hover .zoom-glyph::after {
          animation: none;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .zoom-glyph::after {
          animation: none;
        }
      }

      /* The lighting breakdown: the zoom buttons' frosted glass, a row per lighting layer, the top one first, over
         three.js's direct lighting, beside a vertical slider with a stop at each row's centre, filled by its layer's
         weight. The rows are all --row high, which the slider's stops and thumb are placed by. Its frame rests where
         the view frames the statue beside it: on the right, middle high, or left of the GUI in debug. */
      .breakdown {
        position: fixed;
        z-index: 11;
        top: 50%;
        right: 16px;
        transform: translateY(-50%);
        pointer-events: none;
      }
      .breakdown.beside-gui {
        right: 276px;
      }
      .breakdown-panel {
        --ease: cubic-bezier(0.22, 1, 0.36, 1);
        --ink: #33434b;
        --row: 44px;
        width: 252px;
        padding: 8px 6px 10px;
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.22);
        backdrop-filter: blur(20px) saturate(180%) brightness(1.06);
        -webkit-backdrop-filter: blur(20px) saturate(180%) brightness(1.06);
        box-shadow:
          inset 0 0 0 1px rgba(255, 255, 255, 0.55),
          inset 0 1px 0 rgba(255, 255, 255, 0.4),
          0 6px 20px rgba(20, 28, 40, 0.12),
          0 1px 2px rgba(20, 28, 40, 0.1);
        color: var(--ink);
        font: 13px/1.25 system-ui, sans-serif;
        opacity: 0;
        transform: translateX(16px);
        transition:
          opacity 0.5s var(--ease),
          transform 0.5s var(--ease);
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      .breakdown.shown .breakdown-panel {
        opacity: 1;
        transform: none;
        pointer-events: auto;
      }
      .breakdown-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 0 4px 12px;
      }
      .breakdown-title {
        font-size: 11px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        opacity: 0.7;
      }
      .breakdown-close {
        display: grid;
        place-items: center;
        width: 28px;
        height: 28px;
        padding: 0;
        border: none;
        border-radius: 50%;
        background: none;
        color: inherit;
        cursor: pointer;
        touch-action: manipulation;
      }
      .breakdown-close svg {
        width: 14px;
        height: 14px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
      }
      .breakdown-body {
        display: grid;
        grid-template-columns: 36px minmax(0, 1fr);
      }
      /* The slider: its track from the base's stop to the top layer's, filled up to the thumb at --level */
      .breakdown-slider {
        position: relative;
        border-radius: 18px;
        cursor: pointer;
        touch-action: none;
        outline: none;
      }
      .breakdown-track,
      .breakdown-track-fill,
      .breakdown-stop,
      .breakdown-thumb {
        position: absolute;
        left: 50%;
      }
      .breakdown-track {
        top: calc(var(--row) / 2);
        bottom: calc(var(--row) / 2);
        width: 4px;
        margin-left: -2px;
        border-radius: 2px;
        background: rgba(51, 67, 75, 0.16);
      }
      .breakdown-track-fill {
        bottom: 0;
        left: 0;
        width: 100%;
        height: calc(var(--row) * var(--level, 0));
        border-radius: 2px;
        background: var(--ink);
      }
      /* A stop: a ring, filled by its layer's weight */
      .breakdown-stop {
        bottom: calc(var(--row) * (var(--index) + 0.5) - 5px);
        width: 10px;
        height: 10px;
        margin-left: -5px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.9);
        box-shadow: inset 0 0 0 2px var(--ink);
      }
      .breakdown-stop::after {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: var(--ink);
        transform: scale(var(--weight, 1));
      }
      .breakdown-thumb {
        bottom: calc(var(--row) * (var(--level, 0) + 0.5) - 11px);
        width: 22px;
        height: 22px;
        margin-left: -11px;
        border-radius: 50%;
        background: #fff;
        box-shadow:
          inset 0 0 0 1px rgba(51, 67, 75, 0.12),
          0 2px 6px rgba(20, 28, 40, 0.28),
          0 0 0 0 rgba(255, 255, 255, 0.5);
        cursor: grab;
        transition:
          transform 0.2s var(--ease),
          box-shadow 0.2s var(--ease);
      }
      .breakdown-slider.dragging,
      .breakdown-slider.dragging .breakdown-thumb {
        cursor: grabbing;
      }
      .breakdown-slider.dragging .breakdown-thumb {
        transform: scale(1.15);
      }
      .breakdown-slider:focus-visible .breakdown-thumb {
        box-shadow:
          inset 0 0 0 1px rgba(51, 67, 75, 0.12),
          0 2px 6px rgba(20, 28, 40, 0.28),
          0 0 0 4px rgba(255, 255, 255, 0.7);
      }
      .breakdown-layers {
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .breakdown-layer button {
        display: grid;
        align-content: center;
        width: 100%;
        height: var(--row);
        padding: 0 8px;
        border: none;
        border-radius: 12px;
        background: none;
        color: inherit;
        font: inherit;
        text-align: left;
        cursor: pointer;
        touch-action: manipulation;
        opacity: calc(0.42 + 0.58 * var(--weight, 1));
      }
      .breakdown-name,
      .breakdown-detail {
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .breakdown-name {
        font-weight: 500;
      }
      .breakdown-detail {
        font-size: 11px;
        opacity: 0.7;
      }
      .breakdown-hint {
        margin: 6px 0 0;
        padding: 0 12px;
        font-size: 11px;
        opacity: 0.6;
      }
      .breakdown-hint-touch {
        display: none;
      }
      @media (pointer: coarse) {
        .breakdown-hint-mouse {
          display: none;
        }
        .breakdown-hint-touch {
          display: inline;
        }
      }
      .breakdown button:focus-visible {
        outline: 2px solid rgba(255, 255, 255, 0.9);
        outline-offset: -2px;
      }
      @media (hover: hover) {
        .breakdown-layer button:hover,
        .breakdown-close:hover {
          background: rgba(255, 255, 255, 0.28);
        }
      }
      /* Compact where the window is short, or narrower than the statue's framing (the params' fitAspect, 0.7): at the
         top right on a phone held upright, the statue framed below it */
      @media (max-height: 560px), (max-aspect-ratio: 7/10) {
        .breakdown-panel {
          --row: 32px;
          width: auto;
          padding: 6px 4px 8px;
          border-radius: 16px;
          font-size: 12.5px;
        }
        .breakdown-detail {
          display: none;
        }
      }
      @media (max-aspect-ratio: 7/10) {
        .breakdown {
          top: 12px;
          right: 12px;
          transform: none;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .breakdown-panel,
        .breakdown-thumb {
          transition: none;
        }
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.webgpu.js",
          "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.webgpu.js",
          "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.tsl.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/",
          "lil-gui": "https://cdn.jsdelivr.net/npm/lil-gui@0.21.0/dist/lil-gui.esm.js",
          "stats-gl": "https://cdn.jsdelivr.net/npm/stats-gl@4.2.3/+esm",
          "three-mesh-bvh": "https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.9.15/build/index.module.js",
          "meshoptimizer/encoder": "https://cdn.jsdelivr.net/npm/meshoptimizer@1.2.0/meshopt_encoder.js"
        }
      }
    </script>
    <!-- After the import map, which must come before any module load: the modules that only three's import, fetched at
         once rather than a round trip after their importers -->
    <link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.core.js" />
    <link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/utils/BufferGeometryUtils.js" />
    <link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/utils/SkeletonUtils.js" />
    <script src="../utils/loading.js"></script>
  </head>
  <body>
    <loading-screen style="--background: #a9bdc5 linear-gradient(#98abb4, #bad5e2); --color: #33434b"></loading-screen>
    <!-- The first of the page's three stages, while its modules download -->
    <script>
      document.querySelector('loading-screen').stage('Quarrying marble…')
    </script>
    <script type="module" src="./discobulus-reaction-diffusion.js"></script>
  </body>
</html>
