<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bloom</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #030305;
      }
      canvas {
        display: block;
        touch-action: none;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.webgpu.js",
          "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.webgpu.js",
          "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.tsl.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/",
          "lil-gui": "https://cdn.jsdelivr.net/npm/lil-gui@0.21.0/dist/lil-gui.esm.js",
          "stats-gl": "https://cdn.jsdelivr.net/npm/stats-gl@4.2.3/+esm"
        }
      }
    </script>
  </head>
  <body>
    <script type="module">
      import * as THREE from 'three/webgpu'
      import {
        abs,
        attribute,
        color,
        exp,
        float,
        floor,
        fract,
        hash,
        length,
        max,
        min,
        mix,
        mrt,
        mx_noise_vec3,
        normalView,
        output,
        pass,
        positionViewDirection,
        positionWorld,
        reflector,
        renderOutput,
        select,
        sin,
        smoothstep,
        step,
        uniform,
        vec2,
        vec3,
        vec4,
        velocity,
      } from 'three/tsl'
      import { OrbitControls } from 'three/addons/controls/OrbitControls.js'
      import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js'
      import GUI from 'lil-gui'
      import Stats from 'stats-gl'
      import '../area-light/rectAreaLTC.js' // three's RectAreaLight, with its LTC tables
      import { taau } from '../taau/TAAUNode.js'
      import { bloom } from './BloomNode.js'

      // ---- The hall: a vaulted nave, neon sweeping over it from the left, niches in the right wall, a portal ahead ----

      // Neon colours, a touch outside sRGB so AgX keeps them saturated where they're bright
      const ORANGE = new THREE.Color(1, 0.1, -0.05)
      const AMBER = new THREE.Color(1, 0.22, -0.09)
      const BLUE = new THREE.Color(-0.05, 0.14, 1)
      const MAGENTA = new THREE.Color(1, -0.05, 0.42)
      const BLUE_LIGHT = new THREE.Color(0.02, 0.16, 1)

      const HALF_W = 3.5 // half the nave's width, and the vault's radius
      const WALL_H = 4.6 // where the vault springs from the walls
      const NEAR_Z = 10 // the entrance wall
      const FAR_Z = -13 // the portal wall's face
      const LENGTH = NEAR_Z - FAR_Z
      const TUBE = 0.025

      // Lines up the left wall and over the vault, in clusters: where each starts up the wall, how far round the vault
      // it reaches, in radians from the spring, and its colour when it isn't the amber-to-magenta of its depth
      const SWEEPS = [
        { z: 1.3, from: 0.3, over: 2.6 },
        { z: 0.95, from: 1, over: 2.1 },
        { z: 0.6, from: 0.5, over: 1.7 },
        { z: 0.25, from: 1.6, over: 1.3 },
        { z: -0.1, from: 0.9, over: 0.95 },
        { z: -0.45, from: 2.3, over: 0.6 },
        { z: -2.6, from: 1.2, over: 2.9, tint: BLUE },
        { z: -2.9, from: 0.4, over: 2.4, tint: BLUE },
        { z: -3.2, from: 2, over: 1.9, tint: BLUE },
        { z: -5.6, from: 0.6, over: 2.8 },
        { z: -5.95, from: 1.7, over: 2.15 },
        { z: -6.3, from: 1.1, over: 1.55 },
        { z: -6.65, from: 2.4, over: 1.1 },
        { z: -9.6, from: 0.8, over: 2 },
        { z: -9.95, from: 1.9, over: 1.5 },
        { z: -10.3, from: 1.3, over: 1.1 },
      ]

      // Arched niches in the right wall, wide and narrow in pairs: their centre, half-width and spring height
      const NICHES = [
        { z: 1.9, r: 0.6, spring: 3.2 },
        { z: 0.55, r: 0.28, spring: 3.7 },
        { z: -3.1, r: 0.28, spring: 3.7 },
        { z: -4.35, r: 0.55, spring: 3.3 },
        { z: -8.4, r: 0.42, spring: 3.4 },
        { z: -9.45, r: 0.25, spring: 3.75 },
      ]
      const NICHE_BASE = 0.5
      const NICHE_DEPTH = 0.35
      const FAILING_Z = NICHES[2].z // the niche whose tube flickers now and then
      // Blue bars between the niche pairs, stepping down toward the portal: their z and top
      const BARS = [
        { z: -0.7, top: 3.9 },
        { z: -0.95, top: 3.3 },
        { z: -1.2, top: 2.6 },
        { z: -6, top: 3.6 },
        { z: -6.25, top: 2.9 },
      ]

      const PORTAL_R = 1.5
      const SILL = 0.45
      const PORTAL_SPRING = 3.85
      const PORTAL_DEPTH = 1
      const HALO_R = PORTAL_R + 0.35

      const STEPS = 3
      const STEP_H = SILL / STEPS
      const STEP_D = 0.6
      const STEP_W = 4.4

      const RUNWAY_W = 2
      const RUNWAY_H = 0.06
      const RUNWAY_FAR = FAR_Z + STEPS * STEP_D

      const STRIP_X = RUNWAY_W / 2 - TUBE
      const STRIP_Y = RUNWAY_H + TUBE
      const STRIP_FAR = RUNWAY_FAR + TUBE
      const STRIP_RUN = NEAR_Z - STRIP_FAR

      // The lines over the vault turn from amber to magenta toward the portal.
      const depthTint = (z) => AMBER.clone().lerp(MAGENTA, THREE.MathUtils.clamp((-2 - z) / 8, 0, 1))

      const params = {
        bloom: true,
        speed: 1,
        // Resolution, as worm-monster's desktop tier: the scene's pixels per CSS pixel, one of RENDER_PIXEL_RATIOS,
        // which TAAU upscales to the output's
        renderPixelRatio: 1,
      }
      const RENDER_PIXEL_RATIOS = [0.5, 0.75, 1, 1.25, 1.5, 1.75, 2, 2.5, 3]
      const MAX_PIXEL_RATIO = 2 // the output's pixels per CSS pixel at most

      const renderer = new THREE.WebGPURenderer({ antialias: false })
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, MAX_PIXEL_RATIO))
      renderer.setSize(window.innerWidth, window.innerHeight)
      renderer.toneMapping = THREE.AgXToneMapping
      document.body.appendChild(renderer.domElement)
      await renderer.init()

      const stats = new Stats({ trackGPU: renderer.hasFeature('timestamp-query') })
      document.body.appendChild(stats.dom)
      stats.init(renderer)

      const scene = new THREE.Scene()
      scene.background = new THREE.Color('#030305')

      const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.05, 60)
      const controls = new OrbitControls(camera, renderer.domElement)
      controls.target.set(-0.4, 2.4, FAR_Z + 2)
      controls.enableDamping = true
      controls.enablePan = false
      controls.minDistance = 7
      controls.maxDistance = NEAR_Z - 0.5 - controls.target.z
      // The orbit narrows as the camera backs away, so it turns short of the walls, floor and vault while keeping its
      // distance: up to 0.4 rad either side, and between 72° and 96° from straight up.
      const MARGIN = 0.6
      const spherical = new THREE.Spherical()
      function keepInside() {
        const { target } = controls
        const distance = camera.position.distanceTo(target)
        const reach = (room) => Math.asin(THREE.MathUtils.clamp(room / distance, -1, 1))
        const tilt = (rise) => Math.acos(THREE.MathUtils.clamp(rise / distance, -1, 1))
        controls.minAzimuthAngle = -Math.min(0.4, reach(HALF_W - MARGIN + target.x))
        controls.maxAzimuthAngle = Math.min(0.4, reach(HALF_W - MARGIN - target.x))
        controls.minPolarAngle = Math.max(THREE.MathUtils.degToRad(72), tilt(WALL_H - target.y))
        controls.maxPolarAngle = Math.min(THREE.MathUtils.degToRad(96), tilt(0.4 - target.y))
        // Zooming out turned toward a wall can carry the camera past it: turn it back in, at the same distance.
        spherical.setFromVector3(camera.position.sub(target))
        spherical.theta = THREE.MathUtils.clamp(spherical.theta, controls.minAzimuthAngle, controls.maxAzimuthAngle)
        spherical.phi = THREE.MathUtils.clamp(spherical.phi, controls.minPolarAngle, controls.maxPolarAngle)
        camera.position.setFromSpherical(spherical).add(target)
        camera.lookAt(target)
      }

      // At least 40° across: a portrait screen widens the vertical field rather than crop the walls.
      function fit() {
        camera.aspect = window.innerWidth / window.innerHeight
        const fov = 2 * Math.atan(Math.tan(THREE.MathUtils.degToRad(20)) / camera.aspect)
        camera.fov = THREE.MathUtils.clamp(THREE.MathUtils.radToDeg(fov), 45, 76)
        camera.updateProjectionMatrix()
      }
      fit()
      camera.position.set(0.5, 1.75, camera.aspect < 1 ? 8.6 : 7.2)
      keepInside()
      controls.update()

      window.addEventListener('resize', () => {
        fit()
        renderer.setSize(window.innerWidth, window.innerHeight)
      })

      // ---- Shapes: arch outlines and tubes laid along them ----

      // An arch round x: up one side, over a half circle and down the other, back along the base when closed.
      function archPath(radius, base, spring, { x = 0, closed = true, corner = 0.08, path = new THREE.Path() } = {}) {
        if (closed) {
          path.moveTo(x, base)
          path.lineTo(x + radius - corner, base)
          path.absarc(x + radius - corner, base + corner, corner, -Math.PI / 2, 0)
        } else path.moveTo(x + radius, base)
        path.lineTo(x + radius, spring)
        path.absarc(x, spring, radius, 0, Math.PI)
        if (closed) {
          path.lineTo(x - radius, base + corner)
          path.absarc(x - radius + corner, base + corner, corner, Math.PI, Math.PI * 1.5)
          path.lineTo(x, base)
        } else path.lineTo(x - radius, base)
        return path
      }

      // A 2D path laid into the room by `place(x, y, target)`.
      class PlacedCurve extends THREE.Curve {
        constructor(path, place) {
          super()
          this.path = path
          this.place = place
        }
        getPoint(t, target = new THREE.Vector3()) {
          const p = this.path.getPoint(t)
          return this.place(p.x, p.y, target)
        }
      }

      const luminance = (c) => 0.2126 * c.r + 0.7152 * c.g + 0.0722 * c.b

      // How a tube animates
      const STEADY = 0
      const PULSE = 1 // the runway's strips
      const BREATH = 2 // the niches' outlines

      // A neon tube, its colour scaled to the luminance `level` and kept per vertex with its animation, so every tube
      // merges into one mesh. `tint` is a colour, or a function of z returning one. The bloom takes all of a level from
      // 0.55 and fades it out to 0.25, so a far tube the anti-aliasing thins still glows.
      function tube(path, place, tint, { level = 0.6, channel = STEADY, closed = false, density = 16 } = {}) {
        const segments = Math.max(1, Math.ceil(path.getLength() * density))
        const geometry = new THREE.TubeGeometry(new PlacedCurve(path, place), segments, TUBE, 8, closed)
        const position = geometry.attributes.position
        const colors = new Float32Array(position.count * 3)
        const rgb = new THREE.Color()
        for (let i = 0; i < position.count; i++) {
          rgb.copy(typeof tint === 'function' ? tint(position.getZ(i)) : tint)
          rgb.multiplyScalar(level / luminance(rgb)).toArray(colors, i * 3)
        }
        geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3))
        geometry.setAttribute('channel', new THREE.BufferAttribute(new Float32Array(position.count).fill(channel), 1))
        return geometry
      }

      // A straight run from `a` to `b`
      const straight = (a, b) => new THREE.Path().moveTo(a, 0).lineTo(b, 0)

      // ---- Motion: a pulse running round the runway's strips, niches breathing, one failing tube ----

      const elapsed = uniform(0) // animation time, scaled by the speed control
      const neonGain = uniform(1)
      const { x, y, z } = positionWorld

      // Distance along the strips: up the left one, across before the steps, back down the right one
      const alongStrips = select(
        z.lessThan(STRIP_FAR + 0.1),
        x.add(STRIP_X + STRIP_RUN),
        select(x.lessThan(0), float(NEAR_Z).sub(z), z.sub(STRIP_FAR).add(STRIP_RUN + 2 * STRIP_X)),
      )
      // A comet with a long tail, every PULSE_GAP metres
      const PULSE_GAP = 15
      const PULSE_SPEED = 4.5
      const ahead = fract(alongStrips.sub(elapsed.mul(PULSE_SPEED)).div(PULSE_GAP).add(0.5)).sub(0.5).mul(PULSE_GAP)
      const pulse = select(ahead.lessThan(0), exp(ahead.div(3)), exp(ahead.div(0.3).pow2().negate()))
      const stripGain = pulse.mul(5).add(1)

      // Each niche breathes out of step with the next; the failing one stutters in bursts.
      const stutter = step(0.3, hash(floor(elapsed.mul(14)))).mul(0.9).add(0.1)
      const failing = mix(1, stutter, step(0.8, fract(elapsed.mul(0.09))))
      const breath = sin(elapsed.mul(0.8).add(z.mul(1.9))).mul(0.12).add(1)
      const nicheGain = select(abs(z.sub(FAILING_Z)).lessThan(0.4), failing, breath)

      // ---- Architecture: walls, vault, end walls and steps in one dark stone ----

      // The nave's cross-section, a little oversized to seal the seams with the vault.
      const hallSection = () => {
        const r = HALF_W + 0.05
        return new THREE.Shape()
          .moveTo(-r, -0.05)
          .lineTo(r, -0.05)
          .lineTo(r, WALL_H)
          .absarc(0, WALL_H, r, 0, Math.PI)
          .lineTo(-r, -0.05)
      }

      // The right wall: a slab pierced by the niches, a panel behind it. The shape's x runs along the hall, as -z.
      const rightShape = new THREE.Shape()
        .moveTo(-NEAR_Z, 0)
        .lineTo(-FAR_Z, 0)
        .lineTo(-FAR_Z, WALL_H + 0.1)
        .lineTo(-NEAR_Z, WALL_H + 0.1)
        .lineTo(-NEAR_Z, 0)
      for (const niche of NICHES) rightShape.holes.push(archPath(niche.r, NICHE_BASE, niche.spring, { x: -niche.z }))
      const rightWall = new THREE.ExtrudeGeometry(rightShape, { depth: NICHE_DEPTH, bevelEnabled: false, curveSegments: 16 })
      rightWall.rotateY(Math.PI / 2).translate(HALF_W, 0, 0)
      const nicheBacks = new THREE.PlaneGeometry(LENGTH, WALL_H)
        .rotateY(-Math.PI / 2)
        .translate(HALF_W + NICHE_DEPTH, WALL_H / 2, (NEAR_Z + FAR_Z) / 2)
      const leftWall = new THREE.PlaneGeometry(LENGTH, WALL_H + 0.1)
        .rotateY(Math.PI / 2)
        .translate(-HALF_W, (WALL_H + 0.1) / 2, (NEAR_Z + FAR_Z) / 2)

      const farShape = hallSection()
      farShape.holes.push(archPath(PORTAL_R, SILL, PORTAL_SPRING))
      const farWall = new THREE.ExtrudeGeometry(farShape, { depth: PORTAL_DEPTH, bevelEnabled: false, curveSegments: 32 })
      farWall.translate(0, 0, FAR_Z - PORTAL_DEPTH)

      const steps = Array.from({ length: STEPS }, (_, i) => {
        const depth = (STEPS - i) * STEP_D // from the step's nosing back to the portal wall
        const height = (i + 1) * STEP_H
        return new THREE.BoxGeometry(STEP_W, height, depth).translate(0, height / 2, FAR_Z + depth / 2).toNonIndexed()
      })

      const architecture = mergeGeometries([
        rightWall,
        nicheBacks.toNonIndexed(),
        leftWall.toNonIndexed(),
        farWall,
        new THREE.ShapeGeometry(hallSection(), 32).rotateY(Math.PI).translate(0, 0, NEAR_Z).toNonIndexed(),
        new THREE.CylinderGeometry(HALF_W, HALF_W, LENGTH, 64, 1, true, Math.PI / 2, Math.PI)
          .rotateX(Math.PI / 2)
          .translate(0, WALL_H, (NEAR_Z + FAR_Z) / 2)
          .toNonIndexed(),
        ...steps,
      ])

      // Light only where a tube faces the stone, so nothing glows round the tubes until the bloom does: a niche's
      // reveal, lit from its outline and darkening inward, the blue glow at its back, and the portal's reveal.
      const inset = x.sub(HALF_W) // how deep into the right wall
      const reveal = smoothstep(0, 0.01, inset).mul(exp(inset.negate().div(0.12)))
      const nicheBack = step(NICHE_DEPTH - 0.005, inset).mul(float(WALL_H).sub(y).div(WALL_H).mul(0.7).add(0.3))
      const portalReveal = float(FAR_Z).sub(z).div(PORTAL_DEPTH).clamp(0, 1).pow(1.5)
      const stone = new THREE.MeshStandardNodeMaterial({ color: '#15151c', roughness: 0.6, side: THREE.DoubleSide })
      stone.emissiveNode = color(ORANGE)
        .mul(reveal.mul(nicheGain).mul(0.5))
        .add(color(BLUE).mul(nicheBack.mul(0.5).add(portalReveal.mul(2.2))))
        .mul(neonGain)
      scene.add(new THREE.Mesh(architecture, stone))

      // ---- Bloom: neon brighter than white all round the hall ----

      const neon = []
      const r = HALF_W - TUBE // on the walls' and the vault's surface
      for (const sweep of SWEEPS) {
        const path = new THREE.Path()
          .moveTo(-r, sweep.from)
          .lineTo(-r, WALL_H)
          .absarc(0, WALL_H, r, Math.PI, Math.PI - sweep.over, true)
        neon.push(tube(path, (u, v, t) => t.set(u, v, sweep.z), sweep.tint ?? depthTint, { level: 0.58 }))
      }
      // A cornice line along the right wall's spring, and a blue one along the left wall's foot
      const alongHall = straight(NEAR_Z, FAR_Z)
      neon.push(tube(alongHall, (u, v, t) => t.set(r, WALL_H, u), depthTint, { level: 0.56, density: 1 }))
      neon.push(tube(alongHall, (u, v, t) => t.set(-r, 0.12, u), BLUE, { level: 0.56, density: 1 }))
      // Arch outlines tucked into the niches' edges
      for (const niche of NICHES) {
        const path = archPath(niche.r - TUBE, NICHE_BASE + TUBE, niche.spring, { corner: 0.08 - TUBE })
        const place = (u, v, t) => t.set(HALF_W, v, niche.z + u)
        neon.push(tube(path, place, ORANGE, { level: 0.62, channel: BREATH, closed: true }))
      }
      for (const bar of BARS) {
        neon.push(tube(straight(NICHE_BASE, bar.top), (u, v, t) => t.set(r, u, bar.z), BLUE, { level: 0.58, density: 1 }))
      }
      // The runway's strips: up one edge, across before the steps, back down the other
      const bend = 0.08
      const strip = new THREE.Path()
        .moveTo(-STRIP_X, NEAR_Z)
        .lineTo(-STRIP_X, STRIP_FAR + bend)
        .absarc(-STRIP_X + bend, STRIP_FAR + bend, bend, Math.PI, Math.PI * 1.5)
        .lineTo(STRIP_X - bend, STRIP_FAR)
        .absarc(STRIP_X - bend, STRIP_FAR + bend, bend, -Math.PI / 2, 0)
        .lineTo(STRIP_X, NEAR_Z)
      neon.push(tube(strip, (u, v, t) => t.set(u, STRIP_Y, v), ORANGE, { level: 0.62, channel: PULSE, density: 4 }))
      // Under the upper steps' nosings: the strips run along the first
      for (let i = 1; i < STEPS; i++) {
        const [height, front] = [(i + 1) * STEP_H, FAR_Z + (STEPS - i) * STEP_D]
        const place = (u, v, t) => t.set(u, height - 2 * TUBE, front + TUBE)
        neon.push(tube(straight(-STEP_W / 2, STEP_W / 2), place, AMBER, { level: 0.56, density: 1 }))
      }
      // Round the portal: a magenta outline, then an orange arch down one side only, then a blue arc over the crown
      const onFarWall = (u, v, t) => t.set(u, v, FAR_Z + TUBE)
      const outer = HALO_R + 0.4
      const crown = HALO_R + 0.7
      const shoulder = new THREE.Path()
        .moveTo(outer, PORTAL_SPRING)
        .absarc(0, PORTAL_SPRING, outer, 0, Math.PI)
        .lineTo(-outer, SILL)
      neon.push(tube(archPath(HALO_R, SILL, PORTAL_SPRING, { closed: false }), onFarWall, MAGENTA, { level: 0.66 }))
      neon.push(tube(shoulder, onFarWall, ORANGE, { level: 0.6 }))
      neon.push(tube(new THREE.Path().absarc(0, PORTAL_SPRING, crown, 0.35, 2.2), onFarWall, BLUE, { level: 0.58 }))

      // A tube glows brightest down its middle, where the eye sees through the most gas. Its edges stay dim, so the
      // anti-aliasing's edge samples average to a smooth line rather than to full brightness.
      const throughGas = mix(0.2, 1, normalView.dot(positionViewDirection).clamp())
      const channel = attribute('channel', 'float')
      const animation = select(channel.lessThan(0.5), float(1), select(channel.lessThan(1.5), stripGain, nicheGain))
      const neonMaterial = new THREE.MeshBasicNodeMaterial()
      neonMaterial.colorNode = attribute('color', 'vec3').mul(neonGain).mul(throughGas).mul(animation)
      scene.add(new THREE.Mesh(mergeGeometries(neon), neonMaterial))

      // The portal: a recess filled with blue light, brightest round its edge
      const portalBreath = sin(elapsed.mul(0.5)).mul(0.05).add(1)
      const portalShape = archPath(PORTAL_R + 0.02, SILL - 0.02, PORTAL_SPRING, { path: new THREE.Shape() })
      // Signed distance to the arch in the panel's plane: a box from the sill to the spring line, under a half disc
      const p = positionWorld.xy
      const disc = length(p.sub(vec2(0, PORTAL_SPRING))).sub(PORTAL_R)
      const q = abs(p.sub(vec2(0, (SILL + PORTAL_SPRING) / 2))).sub(vec2(PORTAL_R, (PORTAL_SPRING - SILL) / 2))
      const box = length(max(q, 0)).add(min(max(q.x, q.y), 0))
      const inward = min(disc, box).negate().max(0)
      const portalMaterial = new THREE.MeshBasicNodeMaterial()
      // The rim rises over its first 2 cm, so the panel's edge doesn't alias against the dark reveal.
      const rim = exp(inward.negate().div(0.1)).mul(smoothstep(0, 0.02, inward))
      portalMaterial.colorNode = color(BLUE)
        .mul(rim.mul(3.5).add(exp(inward.negate().div(0.35)).mul(0.4)).add(0.8))
        .mul(neonGain)
        .mul(portalBreath)
      const portal = new THREE.Mesh(new THREE.ShapeGeometry(portalShape, 32), portalMaterial)
      portal.position.z = FAR_Z - PORTAL_DEPTH + 0.002
      scene.add(portal)

      // The portal's light down the hall
      const PORTAL_LIGHT = 2.5
      const portalLight = new THREE.RectAreaLight(BLUE_LIGHT, PORTAL_LIGHT, 2 * PORTAL_R, PORTAL_SPRING + PORTAL_R - SILL)
      portalLight.position.set(0, (SILL + PORTAL_SPRING + PORTAL_R) / 2, FAR_Z + 0.02)
      portalLight.lookAt(0, portalLight.position.y, 0)
      scene.add(portalLight)

      // The environment: the hall seen from its middle, for a faint coloured sheen on the stone
      const pmrem = new THREE.PMREMGenerator(renderer)
      const probe = { position: new THREE.Vector3(0, 2.4, -3) }
      scene.environment = pmrem.fromScene(scene, 0.04, 0.1, 100, probe).texture
      scene.environmentIntensity = 0.3
      pmrem.dispose()

      // ---- The floor: black stone mirroring the neon, the runway's top more than the rest ----

      // One reflection texel per CSS pixel, waving a little as polished stone does. It renders with the camera's jitter,
      // so TAAU anti-aliases it with the rest.
      const reflection = reflector({ resolutionScale: 1 / renderer.getPixelRatio() })
      reflection.target.rotateX(-Math.PI / 2)
      reflection.uvNode = reflection.uvNode.add(mx_noise_vec3(positionWorld.mul(vec3(0.8, 0, 0.35))).xy.mul(0.0012))
      scene.add(reflection.target)

      const onRunway = step(abs(x), RUNWAY_W / 2).mul(step(0.03, y))
      const floorMaterial = new THREE.MeshStandardNodeMaterial({ color: '#08080b', roughness: 0.5 })
      floorMaterial.emissiveNode = reflection.rgb.mul(mix(0.15, 0.45, onRunway))
      const floorGeometry = mergeGeometries([
        new THREE.PlaneGeometry(2 * HALF_W, LENGTH)
          .rotateX(-Math.PI / 2)
          .translate(0, 0, (NEAR_Z + FAR_Z) / 2)
          .toNonIndexed(),
        new THREE.BoxGeometry(RUNWAY_W, RUNWAY_H, NEAR_Z - RUNWAY_FAR)
          .translate(0, RUNWAY_H / 2, (NEAR_Z + RUNWAY_FAR) / 2)
          .toNonIndexed(),
      ])
      scene.add(new THREE.Mesh(floorGeometry, floorMaterial))

      // ---- Post-processing: TAAU smooths the scene, the bloom reads the result ----

      // The scene renders jittered, without MSAA, and TAAU accumulates it into an anti-aliased image.
      const scenePass = pass(scene, camera, { samples: 0 })
      scenePass.setMRT(mrt({ output, velocity }))
      const sceneColor = scenePass.getTextureNode('output')
      const taauNode = taau(sceneColor, scenePass.getTextureNode('depth'), scenePass.getTextureNode('velocity'), camera)
      const resolved = taauNode.getTextureNode()
      const bloomNode = bloom(resolved, { strength: 0.4, radius: 0, threshold: 0.25, smoothWidth: 0.3 })

      // The scene pass at renderPixelRatio, which TAAU upscales to the output's pixel ratio; the bloom reads TAAU's
      // output.
      const sceneScale = () => Math.min(1, params.renderPixelRatio / renderer.getPixelRatio())
      function setSampling() {
        scenePass.setResolutionScale(sceneScale())
      }
      // The output's pixel ratio, and the scene's share of it: a move to another display changes the device's.
      function setPixelRatio() {
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, MAX_PIXEL_RATIO))
        reflection.reflector.resolutionScale = 1 / renderer.getPixelRatio()
        setSampling()
      }
      setSampling()
      window.addEventListener('resize', setPixelRatio)

      const pipeline = new THREE.RenderPipeline(renderer)
      pipeline.outputColorTransform = false
      function setOutput() {
        pipeline.outputNode = renderOutput(params.bloom ? vec4(resolved.rgb.add(bloomNode.rgb), 1) : resolved)
        pipeline.needsUpdate = true
      }
      setOutput()

      const gui = new GUI({ title: 'Bloom' })
      if (window.innerWidth < 600) gui.close()
      gui.add(params, 'bloom').onChange(setOutput)
      gui.add(bloomNode.strength, 'value', 0, 3, 0.01).name('strength')
      gui.add(bloomNode.radius, 'value', 0, 1, 0.01).name('radius')
      gui.add(bloomNode.threshold, 'value', 0, 2.5, 0.01).name('threshold')
      gui.add(neonGain, 'value', 0, 2, 0.01).name('neon strength')
      gui.add(params, 'speed', 0, 3, 0.01)
      const resolution = gui.addFolder('Resolution')
      resolution.add(params, 'renderPixelRatio', RENDER_PIXEL_RATIOS).name('render pixel ratio').onChange(setSampling)

      const timer = new THREE.Timer()
      timer.connect(document)
      renderer.setAnimationLoop((time) => {
        timer.update(time)
        elapsed.value += timer.getDelta() * params.speed
        portalLight.intensity = PORTAL_LIGHT * neonGain.value * (1 + 0.05 * Math.sin(elapsed.value * 0.5))
        controls.update()
        keepInside()
        pipeline.render()
        stats.update()
        renderer.resolveTimestampsAsync('render')
      })
    </script>
  </body>
</html>
