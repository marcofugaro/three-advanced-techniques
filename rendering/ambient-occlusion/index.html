<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ambient Occlusion</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #9ea4c1;
      }
      canvas {
        display: block;
        touch-action: none;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.webgpu.js",
          "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.webgpu.js",
          "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.tsl.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/",
          "lil-gui": "https://cdn.jsdelivr.net/npm/lil-gui@0.21.0/dist/lil-gui.esm.js",
          "stats-gl": "https://cdn.jsdelivr.net/npm/stats-gl@4.2.3/+esm"
        }
      }
    </script>
    <script src="../../utils/loading.js"></script>
  </head>
  <body>
    <loading-screen style="--background: #9ea4c1; --color: #2f3046"></loading-screen>
    <script type="module">
      import * as THREE from 'three/webgpu'
      import {
        Fn,
        builtinAOContext,
        clamp,
        context,
        exp,
        floor,
        instanceIndex,
        instancedArray,
        length,
        max,
        mrt,
        mx_noise_float,
        normalViewGeometry,
        output,
        packNormalToRGB,
        pass,
        positionLocal,
        positionPrevious,
        renderOutput,
        sample,
        smoothstep,
        uint,
        uniform,
        unpackRGBToNormal,
        vec2,
        vec3,
        vec4,
        velocity,
      } from 'three/tsl'
      import { OrbitControls } from 'three/addons/controls/OrbitControls.js'
      import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js'
      import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js'
      import GUI from 'lil-gui'
      import Stats from 'stats-gl'
      import { syncUnjitteredProjection, taau } from '../taau/TAAUNode.js'
      import { xeGTAO } from './XeGTAONode.js'

      // ---- A soft lilac studio: matte clay under a gentle key light, so the occlusion reads ----

      const HAZE = new THREE.Color('#9ea1e0')
      const CLAY = '#8083c0'

      const params = {
        ao: true,
        aoResolution: 0.5, // × the scene pass
        view: 'beauty',
        speed: 1,
        height: 0.4,
        shadowMapSize: 1024,
        // The scene's pixels per CSS pixel, which TAAU upscales to the output's
        renderPixelRatio: 1,
      }
      const MAX_PIXEL_RATIO = 2 // the output's pixels per CSS pixel at most

      const loading = document.querySelector('loading-screen')
      // No canvas MSAA: TAAU antialiases the scene pass
      const renderer = new THREE.WebGPURenderer({ antialias: false })
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, MAX_PIXEL_RATIO))
      renderer.setSize(window.innerWidth, window.innerHeight)
      renderer.toneMapping = THREE.AgXToneMapping
      renderer.shadowMap.enabled = true
      renderer.shadowMap.type = THREE.PCFShadowMap
      document.body.appendChild(renderer.domElement)
      await renderer.init()

      const stats = new Stats({ trackGPU: renderer.hasFeature('timestamp-query') })
      document.body.appendChild(stats.dom)
      stats.init(renderer)

      const scene = new THREE.Scene()
      scene.background = HAZE
      scene.fog = new THREE.Fog(HAZE)

      const pmrem = new THREE.PMREMGenerator(renderer)
      scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture
      scene.environmentIntensity = 0.7
      pmrem.dispose()

      const key = new THREE.DirectionalLight('#fff8f0', 1.9)
      key.position.set(-4, 7, 3)
      key.castShadow = true
      key.shadow.mapSize.setScalar(params.shadowMapSize)
      key.shadow.camera.left = key.shadow.camera.bottom = -10
      key.shadow.camera.right = key.shadow.camera.top = 10
      key.shadow.camera.near = 1
      key.shadow.camera.far = 20
      key.shadow.bias = -0.0004
      key.shadow.normalBias = 0.01
      key.shadow.radius = 6
      scene.add(key)

      const camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.1, 80)
      const controls = new OrbitControls(camera, renderer.domElement)
      controls.target.set(0, 0.6, 0)
      controls.enableDamping = true
      controls.minDistance = 2
      controls.maxDistance = 18
      controls.maxPolarAngle = THREE.MathUtils.degToRad(75)

      // A narrow screen backs off to keep about the same width in view.
      const halfWidth = Math.atan(Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2) * camera.aspect)
      const distance = THREE.MathUtils.clamp(4.47 / Math.tan(halfWidth), 5, 12)
      camera.position.set(5.495, 5.164, 1.312).setLength(distance).add(controls.target)
      scene.fog.near = distance + 1
      scene.fog.far = 30
      controls.update()

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight
        camera.updateProjectionMatrix()
        renderer.setSize(window.innerWidth, window.innerHeight)
      })

      // ---- A field of hexagonal prisms stepping up and down: tubes, solid blocks and engraved tiles ----

      const SIZE = 0.5 // a cell's circumradius
      const RINGS = 18 // cells from the center to the field's edge
      const LEVELS = 4 // the heights a cell steps between, from the floor up
      const BODY = 3.2 // a prism's length below its top, enough to reach under the floor at any height
      const FLOOR = -0.75
      const PRESS_RADIUS = 1.8

      // The prisms' shapes, each one drawn once per cell of its kind.
      const hexagon = (radius, path = new THREE.Shape()) => {
        for (let i = 0; i < 6; i++) {
          const angle = (i / 6) * Math.PI * 2
          if (i === 0) path.moveTo(radius * Math.cos(angle), radius * Math.sin(angle))
          else path.lineTo(radius * Math.cos(angle), radius * Math.sin(angle))
        }
        path.closePath()
        return path
      }
      const hexRing = (outer, inner) => {
        const shape = hexagon(outer)
        shape.holes.push(hexagon(inner, new THREE.Path()))
        return shape
      }
      // `shape` from `top` down to `bottom`, its top edges rounded inward by `bevel`
      const prism = (shape, top, bottom, bevel = 0) =>
        new THREE.ExtrudeGeometry(shape, {
          depth: top - bottom - 2 * bevel,
          bevelEnabled: bevel > 0,
          bevelThickness: bevel,
          bevelSize: bevel,
          bevelOffset: -bevel,
          bevelSegments: 3,
        })
          .rotateX(-Math.PI / 2)
          .translate(0, bottom + bevel, 0)

      const OUTER = SIZE - 0.012 / Math.sqrt(3) // a hairline gap between neighbours
      const BEVEL = 0.022
      const HOLE = 0.29
      const GROOVE = 0.3
      const tube = mergeGeometries([
        prism(hexRing(OUTER, HOLE), 0, -BODY, BEVEL),
        prism(hexagon(HOLE + 0.02), -0.6, -0.65), // the tube's floor
      ])
      const block = prism(hexagon(OUTER), 0, -BODY, BEVEL)
      const tile = mergeGeometries([
        prism(hexRing(OUTER, GROOVE), 0, -BODY, BEVEL),
        prism(hexagon(GROOVE - 0.03), 0, -0.1, 0.008),
        prism(hexagon(GROOVE + 0.02), -0.04, -0.1), // the groove's floor
      ])

      // Flat-topped cells, grouped by kind so each kind draws as one contiguous range.
      const KINDS = [
        { geometry: tube, share: 0.5, cells: [] },
        { geometry: block, share: 0.2, cells: [] },
        { geometry: tile, share: 0.3, cells: [] },
      ]
      THREE.MathUtils.seededRandom(3)
      const random = () => THREE.MathUtils.seededRandom()
      for (let q = -RINGS; q <= RINGS; q++) {
        for (let r = Math.max(-RINGS, -q - RINGS); r <= Math.min(RINGS, -q + RINGS); r++) {
          const pick = random()
          let sum = 0
          const kind = KINDS.find(({ share }) => pick < (sum += share)) ?? KINDS.at(-1)
          const x = SIZE * 1.5 * q
          const z = SIZE * Math.sqrt(3) * (r + q / 2)
          // its level offset, so steps don't follow the noise's contours exactly, and its spring's stiffness
          kind.cells.push(x, z, 1.7 + (random() - 0.5) * 0.7, 70 + random() * 40)
        }
      }
      const COUNT = KINDS.reduce((sum, { cells }) => sum + cells.length / 4, 0)

      const cellData = new Float32Array(KINDS.flatMap(({ cells }) => cells))
      const cells = instancedArray(cellData, 'vec4') // x, z, level offset, stiffness
      const states = instancedArray(COUNT, 'vec2') // height, velocity

      // Each kind's cells, lifted to their heights in the vertex shader.
      let first = 0
      for (const { geometry, cells: kindCells } of KINDS) {
        const cell = instanceIndex.add(uint(first))
        const at = cells.element(cell)
        const material = new THREE.MeshStandardNodeMaterial({ color: CLAY, roughness: 0.62 })
        material.positionNode = Fn((builder) => {
          const state = states.element(cell)
          // the height before this frame's step, for the motion vectors TAAU reprojects by
          if (builder.needsPreviousData()) {
            positionPrevious.assign(positionLocal.add(vec3(at.x, state.x.sub(state.y.mul(uDelta)), at.y)))
          }
          return positionLocal.add(vec3(at.x, state.x, at.y))
        })()
        geometry.deleteAttribute('uv')
        const mesh = new THREE.Mesh(geometry, material)
        mesh.count = kindCells.length / 4
        mesh.frustumCulled = false
        mesh.castShadow = mesh.receiveShadow = true
        scene.add(mesh)
        first += mesh.count
      }

      const ground = new THREE.Mesh(
        new THREE.CircleGeometry(60, 96).rotateX(-Math.PI / 2).translate(0, FLOOR, 0),
        new THREE.MeshStandardNodeMaterial({ color: CLAY, roughness: 0.8 }),
      )
      ground.receiveShadow = true
      scene.add(ground)

      // Per cell: step to a level of a slowly drifting noise, pressed down around the pointer, and spring to it.
      const uTime = uniform(0)
      const uDelta = uniform(0)
      const uStep = uniform(params.height)
      const uPointer = uniform(new THREE.Vector3()) // x, z, press
      const updateCells = Fn(() => {
        const cell = cells.element(instanceIndex)
        const state = states.element(instanceIndex)
        const xz = cell.xy
        const drift = vec3(xz.x.mul(0.3).add(uTime.mul(0.05)), uTime.mul(0.08), xz.y.mul(0.3))
        const level = clamp(floor(mx_noise_float(drift).mul(LEVELS * 1.5).add(cell.z)), 0, LEVELS - 1)
        const press = smoothstep(0, PRESS_RADIUS, length(xz.sub(uPointer.xy))).oneMinus().mul(uPointer.z)
        const target = max(level.sub(floor(press.mul(LEVELS + 1))), -1).mul(uStep)
        const height = state.x.toVar()
        const velocity = state.y.toVar()
        velocity.addAssign(target.sub(height).mul(cell.w).mul(uDelta))
        velocity.mulAssign(exp(uDelta.mul(-11)))
        height.addAssign(velocity.mul(uDelta))
        state.assign(vec2(height, velocity))
      })().compute(COUNT)

      // The pointer presses wherever it points on the field.
      const pointer = { target: new THREE.Vector2(), position: new THREE.Vector2(), over: false, press: 0 }
      const raycaster = new THREE.Raycaster()
      const ndc = new THREE.Vector2()
      const surface = new THREE.Plane(new THREE.Vector3(0, 1, 0))
      const hit = new THREE.Vector3()
      renderer.domElement.addEventListener('pointermove', (event) => {
        ndc.set((event.clientX / window.innerWidth) * 2 - 1, -(event.clientY / window.innerHeight) * 2 + 1)
        raycaster.setFromCamera(ndc, camera)
        surface.constant = -1.5 * params.height
        const onField =
          raycaster.ray.intersectPlane(surface, hit) !== null && Math.hypot(hit.x, hit.z) < RINGS * 0.7
        if (onField && !pointer.over && pointer.press < 0.05) pointer.position.set(hit.x, hit.z)
        if (onField) pointer.target.set(hit.x, hit.z)
        pointer.over = onField
      })
      renderer.domElement.addEventListener('pointerleave', () => (pointer.over = false))

      let time = 0
      function animate(delta) {
        time += delta * params.speed
        uTime.value = time
        uDelta.value = delta
        pointer.press += ((pointer.over ? 1 : 0) - pointer.press) * (1 - Math.exp(-delta * 6))
        pointer.position.lerp(pointer.target, 1 - Math.exp(-delta * 12))
        uPointer.value.set(pointer.position.x, pointer.position.y, pointer.press)
      }

      // ---- Ambient occlusion: XeGTAO on an opaque prepass, darkening only the ambient light ----

      const prePass = pass(scene, camera, { samples: 0 })
      prePass.transparent = false
      prePass.contextNode = context({ getAO: null })
      prePass.setMRT(mrt({ output: packNormalToRGB(normalViewGeometry) }))
      prePass.getTexture('output').type = THREE.UnsignedByteType
      const prePassNormal = sample((uv) => unpackRGBToNormal(prePass.getTextureNode().sample(uv)))

      const occlusion = xeGTAO(prePass.getTextureNode('depth'), camera, {
        normalNode: prePassNormal,
        radius: 0.6,
      })
      const aoContext = builtinAOContext(occlusion.getMaterialAONode())

      // ---- TAAU: the jittered scene, with the motion it reprojects by, accumulated into an anti-aliased image ----

      const scenePass = pass(scene, camera, { samples: 0 })
      scenePass.setMRT(mrt({ output, velocity }))
      const velocityTexture = scenePass.getTexture('velocity')
      velocityTexture.type = THREE.HalfFloatType // RG16F
      velocityTexture.format = THREE.RGFormat
      const sceneColor = scenePass.getTextureNode('output')
      const taauNode = taau(sceneColor, scenePass.getTextureNode('depth'), scenePass.getTextureNode('velocity'), camera)

      // The scene pass and its prepass at renderPixelRatio, XeGTAO at aoResolution of it; TAAU upscales them to the
      // output's pixel ratio.
      const sceneScale = () => Math.min(1, params.renderPixelRatio / renderer.getPixelRatio())
      function setSampling() {
        const scale = sceneScale()
        for (const node of [scenePass, prePass]) node.setResolutionScale(scale)
        occlusion.resolutionScale = params.aoResolution * scale
      }
      // The output's pixel ratio, and the scene's share of it: a move to another display changes the device's.
      function setPixelRatio() {
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, MAX_PIXEL_RATIO))
        setSampling()
      }
      setSampling()
      window.addEventListener('resize', setPixelRatio)

      const pipeline = new THREE.RenderPipeline(renderer)
      pipeline.outputColorTransform = false
      let resolving = false
      function setOutput() {
        scenePass.contextNode = params.ao ? aoContext : null
        scenePass.needsUpdate = true
        // The occlusion view shows the AO as computed, unjittered; TAAU's history goes stale meanwhile.
        const resolve = params.view === 'beauty'
        if (resolve && !resolving) taauNode.resetHistory()
        resolving = resolve
        // both views tone-map with AgX
        const ao = vec4(vec3(occlusion.getAONode()), 1)
        pipeline.outputNode = renderOutput(params.view === 'occlusion' ? ao : taauNode.getTextureNode())
        pipeline.needsUpdate = true
      }
      setOutput()

      const gui = new GUI({ title: 'Ambient occlusion' })
      if (window.innerWidth < 600) gui.close()
      gui.add(params, 'ao').name('ambient occlusion').onChange(setOutput)
      gui.add(params, 'view', ['beauty', 'occlusion']).onChange(setOutput)
      gui.add(occlusion.radius, 'value', 0.05, 1, 0.01).name('radius (m)')
      gui.add(occlusion.intensity, 'value', 0, 1, 0.01).name('intensity')
      gui.add(occlusion.power, 'value', 0.5, 4, 0.05).name('power')
      gui.add(params, 'aoResolution', 0.25, 1, 0.25).name('resolution').onChange(setSampling)
      gui.add(occlusion, 'temporalAccumulation').name('temporal accumulation')
      gui.add(occlusion, 'motionSliceCount', 2, 4, 1).name('slices in motion')
      const field = gui.addFolder('Hexagons')
      field.add(params, 'speed', 0, 3, 0.01)
      field.add(params, 'height', 0.1, 0.6, 0.01).name('step (m)').onChange((value) => (uStep.value = value))
      const shadow = gui.addFolder('Shadow')
      shadow.add(key.shadow, 'intensity', 0, 1, 0.01)
      shadow.add(key.shadow, 'radius', 0, 10, 0.1).name('softness')
      shadow.add(key.shadow, 'bias', -0.005, 0.005, 0.0001)
      shadow.add(key.shadow, 'normalBias', 0, 0.1, 0.001).name('normal bias')
      shadow.add(params, 'shadowMapSize', [512, 1024, 2048, 4096]).name('map size').onChange((value) => key.shadow.mapSize.setScalar(value))

      await loading.stage('Compiling shaders…')
      await taauNode.compileAsync(renderer)
      const timer = new THREE.Timer()
      timer.connect(document)
      renderer.setAnimationLoop((now) => {
        timer.update(now)
        animate(Math.min(timer.getDelta(), 1 / 20))
        renderer.compute(updateCells)
        controls.update()
        syncUnjitteredProjection(camera) // kept live while the occlusion view leaves TAAU out
        pipeline.render()
        stats.update()
        renderer.resolveTimestampsAsync('compute')
        renderer.resolveTimestampsAsync('render')
      })
      loading.done()
    </script>
  </body>
</html>
